<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | CollabChord</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-purple: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --spotify-green: #1db954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(to right, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .form-input {
      width: 100%;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .form-options {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      color: var(--text-muted);
    }

    .form-options input {
      accent-color: var(--accent-purple);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent-purple);
      color: white;
      margin-bottom: 16px;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 24px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .btn-spotify {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-spotify:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: var(--spotify-green);
    }

    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent-purple);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">CollabChord</div>
      <div class="brand-subtitle">Create your account and start making music together.</div>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" placeholder="Alex Rivera" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <input class="form-input" type="password" id="confirm-password" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the terms and privacy policy</label>
      </div>

      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="divider">or continue with</div>

    <button class="btn btn-spotify" id="spotify-login-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color: var(--spotify-green)">
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.893-.982-.336.075-.668-.135-.744-.47-.075-.336.135-.668.47-.743 3.856-.88 7.15-.505 9.822 1.13.295.178.387.563.205.858zm1.224-2.723c-.226.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.08-1.182-.413.125-.847-.107-.972-.52-.125-.413.107-.847.52-.972 3.676-1.114 8.243-.573 11.347 1.33.367.226.487.707.258 1.074zm.105-2.833C14.383 8.8 8.417 8.604 4.973 9.65c-.534.162-1.097-.142-1.26-.676-.162-.534.142-1.097.676-1.26 3.97-1.206 10.554-.985 14.616 1.424.48.285.637.902.35 1.38-.285.48-.903.638-1.38.35z"/>
      </svg>
      Connect Spotify
    </button>

    <div class="footer-text">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script src="supabase-config.js"></script>
  <script>

    const supabase = window.supabase.createClient(window.CC_SUPABASE_URL, window.CC_SUPABASE_KEY);
    const form = document.getElementById('signup-form');
    const button = form.querySelector('button[type="submit"]');
    const message = document.createElement('p');
    message.setAttribute('role','status'); message.style.cssText='color:#fca5a5;font-size:.9rem;margin:0 0 14px;';
    form.prepend(message);
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); message.textContent='';
      const password=document.getElementById('password').value, confirmPassword=document.getElementById('confirm-password').value;
      if(password!==confirmPassword){message.textContent='Passwords do not match.';return;}
      button.disabled=true;button.textContent='Creating account…';
      const {data,error}=await supabase.auth.signUp({email:document.getElementById('email').value.trim(),password,options:{data:{display_name:document.getElementById('name').value.trim()},emailRedirectTo:window.location.origin+'/index.html'}});
      if(error){message.textContent=error.message;button.disabled=false;button.textContent='Create Account';return;}
      if(data.user && data.session){
        await supabase.from('profiles').upsert({id:data.user.id,display_name:document.getElementById('name').value.trim()});
        window.location.href='index.html';
      } else {
        message.style.color='#86efac';message.textContent='Account created. Check your email to confirm, then sign in.';
        button.disabled=false;button.textContent='Create Account';
      }
    });
    document.getElementById('spotify-login-btn').addEventListener('click',()=>{message.textContent='Spotify sign-in is not configured yet. Use email and password for now.';});

  </script>
</body>
</html>

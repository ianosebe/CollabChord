<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out | CollabChord</title>
  <style>
    /* Sharing design tokens from the application UI */
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .logout-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: rgba(139, 92, 246, 0.1);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px auto;
      color: var(--accent-purple);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn-relogin {
      display: inline-block;
      width: 100%;
      background-color: var(--accent-purple);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-relogin:hover {
      background-color: #7c3aed;
    }

    .redirect-notice {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="logout-container">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V6l12-2v12"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>

    <h2>Session Safely Closed</h2>
    <p>You've successfully signed out of CollabChord. Your project stems and session progress have been safely synced to the cloud workspace.</p>

    <a href="login.html" class="btn-relogin">Log Back In</a>

    <div class="redirect-notice">
      Redirecting to login page in <span id="countdown">5</span> seconds...
    </div>
  </div>

  <script>
    // Handles automatic fallback redirection
    let secondsLeft = 5;
    const countdownEl = document.getElementById('countdown');
    
    const interval = setInterval(() => {
      secondsLeft--;
      countdownEl.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.href = 'login.html';
      }
    }, 1000);
  </script>
</body>
</html>
